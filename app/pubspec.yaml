name: app
description: "Connecto messenger."
publish_to: 'none'

version: 1.3.3+16

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.20
  http: ^1.2.0
  # веб-версия: файлы из браузера и уведомления
  cross_file: ^0.3.4
  web: ^1.1.0
  shared_preferences: ^2.2.0
  web_socket_channel: ^3.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  record: ^6.2.1
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  geolocator: ^13.0.1
  flutter_slidable: ^3.1.1
  flutter_local_notifications: ^19.5.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  video_player: ^2.9.2
  cryptography: ^2.7.0
  flutter_webrtc: ^1.6.0
  camera: ^0.12.0
  # «вспышка» фронталки в кружочках — яркость экрана на максимум
  screen_brightness: ^2.1.0
  # компьютер (Windows)
  camera_windows: ^0.3.0
  video_player_win: ^3.2.2
  window_manager: ^0.5.2
  desktop_drop: ^0.8.4
  # звонки на Windows: узнать микрофон и динамики «по умолчанию»
  win32: ^5.15.0
  ffi: ^2.1.4
  # вход по QR: код на компьютере, сканер на телефоне
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gifts/
    - assets/stickers/
    - assets/coin.webp
    - assets/app_icons/
    - assets/mascot/
    - assets/wallpapers/
    - assets/sounds/

  # иконки приложения — Phosphor (lib/icons.dart)
  fonts:
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
